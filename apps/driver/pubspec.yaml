name: trotxi_driver
description: Trotxi driver app — run routes, publish GPS, scan rider passes.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # NOTE: geolocator (device GPS) and mobile_scanner (camera QR) are intended
  # for the driver app on a physical device. They're omitted here so the app
  # builds/runs on the iOS simulator without native-plugin toolchain setup.
  # The Drive screen simulates movement along the route; Scan uses manual entry.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
