# Render blueprint for the Trotxi API + Postgres.
# Deploy: render.com → New → Blueprint → connect this repo. Render reads this file,
# provisions a Postgres database and the API web service, and wires DATABASE_URL.
databases:
  - name: trotxi-db
    databaseName: trotxi
    user: trotxi
    plan: free
    region: frankfurt # closest Render region to Ghana

services:
  - type: web
    name: trotxi-api
    runtime: docker
    repo: https://github.com/godfredAwuku/Trotxi
    branch: main
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      - key: JWT_EXPIRES_IN
        value: 7d
      # Seed demo routes/trips on first boot. Set to false after the first
      # successful deploy so restarts don't wipe rider boardings.
      - key: SEED_ON_START
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: trotxi-db
          property: connectionString
